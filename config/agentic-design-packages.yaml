    - DEMARRAGE-AGENT.md
    - CHANGELOG.md
    - documentation/INSTALLER-ET-TESTER.md
    - documentation/MODE-OPERATOIRE.md
    - documentation/AUDIT-RGAA-CREATOR.md
    - templates/AGENTS.md.exemple
    - templates/CLAUDE.md.exemple
    - virginie-livrables/PROMPT-GOAL-GOVERNOR-AUDIT-DSFR-DOUANE.md

claims:
  allowed:
    - aligné DSFR avec limites
    - prototype DSFR à vérifier avant publication
    - composants DSFR utilisés selon les sources lues
  forbidden_without_dedicated_proof:
    - conforme DSFR
    - conforme RGAA
    - prêt pour publication
