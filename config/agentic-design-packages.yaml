schema_version: 1
name: dsfr-agentic-kit
version: "0.1.0"
status: local-prototype
purpose: >-
  Router, contraindre, générer et vérifier des interfaces publiques françaises
  sans confondre génération plausible et conformité prouvée.

runtime:
  language: fr-FR
  python_minimum: "3.10"
  node_minimum: "20"
  dsfr_version: "1.15.2"
  canonical_skill_root: ".claude/skills"
  portable_usage: >-
    Tout agent capable de lire des fichiers locaux peut suivre les SKILL.md ;
    la découverte native des skills reste facultative.

product:
  skills:
    - a11y-loop
    - a11y-shared-references
    - agentic-design-harness
    - audit-a11y-complet
    - audit-accessibilite-web
    - audit-dsfr-complet
    - audit-report-dsfr
    - audit-rgaa-complet
    - audit-rgaa-dsfr
    - audit-rgaa-creator
    - dsfr-changelog
    - dsfr-components
    - fix-accessibilite
    - generer-pictos-svg-dsfr
    - pre-audit-rgaa-dsfr
    - screen-reader-testing
    - tests-conformite-wcag
    - ticket-rgaa
  required_paths:
    - README.md
    - .claude-plugin/marketplace.json
    - DEMARRAGE-AGENT.md
    - LICENSE
    - CHANGELOG.md
    - templates/AGENTS.md.exemple
    - templates/CLAUDE.md.exemple
    - documentation/INSTALLER-ET-TESTER.md
    - documentation/MODE-OPERATOIRE.md
    - documentation/AUDIT-RGAA-CREATOR.md
    - .claude/skills/audit-dsfr-complet/SKILL.md
    - .claude/skills/audit-dsfr-complet/rules/dsfr-rules.json
    - .claude/skills/audit-dsfr-complet/schemas/dsfr-rules.schema.json
    - .claude/skills/audit-dsfr-complet/schemas/dsfr-findings.schema.json
    - .claude/skills/audit-report-dsfr/SKILL.md
    - .claude/skills/audit-rgaa-complet/SKILL.md
