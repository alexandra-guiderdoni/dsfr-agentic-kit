    - scripts/tests/check-dsfr-design-router-load-when-needed.sh
    - scripts/tests/check-dsfr-changelog-skill.sh
    - scripts/tests/check-assembled-page-rejects-unsafe-href.sh
    - scripts/tests/check-component-neutralises-unsafe-href.sh
    - scripts/tests/check-dsfr-pictograms-doc.sh
