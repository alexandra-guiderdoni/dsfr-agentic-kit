    - .claude/skills/audit-rgaa-complet/schemas/rgaa-findings.schema.json
    - .claude/skills/audit-rgaa-complet/schemas/rgaa-page.schema.json
    - .claude/skills/audit-rgaa-complet/schemas/rgaa-rules.schema.json
    - .claude/skills/audit-rgaa-creator/SKILL.md
    - .claude/skills/audit-rgaa-creator/schemas/campaign.schema.json
