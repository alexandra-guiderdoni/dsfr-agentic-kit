<form action="/submit" method="post" novalidate>
    <fieldset class="fr-fieldset">
        <legend class="fr-fieldset__legend">
            <h2>Formulaire</h2>
        </legend>
        <div class="fr-fieldset__content">
                            <div class="fr-input-group">
                                <label class="fr-label" for="nom">Nom
                                </label>
                                <input class="fr-input" type="text" id="nom" name="nom">
                            </div>
                            <div class="fr-input-group">
                                <label class="fr-label" for="email">Email
                                </label>
                                <input class="fr-input" type="email" id="email" name="email">
                            </div>
            <ul class="fr-btns-group">
                <li><button class="fr-btn" type="submit">Envoyer</button></li>
            </ul>
        </div>
    </fieldset>
</form>
